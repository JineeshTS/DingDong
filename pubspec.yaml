name: dingdong
description: Next-generation task management application with AI-powered features
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  flutter_slidable: ^3.0.1
  animations: ^2.0.11
  rive: ^0.12.4
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

  # State Management (Riverpod)
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.9
  firebase_performance: ^0.9.3+6
  cloud_functions: ^4.6.0

  # Google Sign In
  google_sign_in: ^6.1.6

  # Apple Sign In
  sign_in_with_apple: ^5.0.0

  # Microsoft OAuth
  aad_oauth: ^1.0.0

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.1

  # Key-Value Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^5.0.2

  # JSON Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # Date & Time
  intl: ^0.19.0
  timeago: ^3.6.0
  flutter_native_timezone: ^2.0.0

  # AI & ML
  google_mlkit_text_recognition: ^0.11.0
  google_ml_kit: ^0.16.3
  tflite_flutter: ^0.10.4
  image_picker: ^1.0.5
  camera: ^0.10.5+7
  image: ^4.1.3

  # Cloud AI (will integrate via API)
  # google_generative_ai: will use via cloud functions

  # Notifications
  flutter_local_notifications: ^16.2.0
  timezone: ^0.9.2

  # Location & Geofencing
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0
  # flutter_geofence removed - package doesn't exist, use geofence_service instead
  geofence_service: ^5.0.0

  # Calendar Integration
  googleapis: ^11.4.0
  googleapis_auth: ^1.4.1
  device_calendar: ^4.3.1

  # File Handling
  file_picker: ^6.1.1
  open_file: ^3.3.2
  path: ^1.8.3
  mime: ^1.0.4

  # Charts & Analytics
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^24.1.41

  # Calendar Views
  table_calendar: ^3.0.9
  syncfusion_flutter_calendar: ^24.1.41

  # Rich Text Editor
  flutter_quill: ^9.0.0

  # Natural Language Processing
  any_link_preview: ^3.0.1

  # Voice Input
  speech_to_text: ^6.5.1

  # URL Launcher
  url_launcher: ^6.2.2

  # Share
  share_plus: ^7.2.1

  # Biometrics
  local_auth: ^2.1.8

  # QR Code (for sharing)
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1

  # Excel Export
  excel: ^4.0.2

  # UUID Generation
  uuid: ^4.2.2

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  collection: ^1.18.0

  # Logging
  logger: ^2.0.2+1

  # Environment Configuration
  flutter_dotenv: ^5.1.0

  # App Lifecycle
  lifecycle: ^0.3.0

  # Platform Info
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1

  # Widgets
  flutter_colorpicker: ^1.0.3
  emoji_picker_flutter: ^1.6.3
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1
  dotted_border: ^2.1.0

  # Drag and Drop
  flutter_reorderable_list: ^1.3.1
  reorderables: ^0.6.0

  # Splash Screen
  flutter_native_splash: ^2.3.9

  # App Icon
  flutter_launcher_icons: ^0.13.1

  # In-App Purchase (Monetization)
  in_app_purchase: ^3.1.11
  purchases_flutter: ^6.13.0  # RevenueCat

  # Analytics
  mixpanel_flutter: ^2.1.1

  # Error Tracking
  sentry_flutter: ^7.14.0

  # WebView (for OAuth)
  webview_flutter: ^4.4.4
  flutter_inappwebview: ^6.0.0

  # Markdown Support
  flutter_markdown: ^0.6.18+2
  markdown: ^7.1.1

  # Haptic Feedback
  vibration: ^1.8.4

  # App Links & Deep Linking
  app_links: ^3.5.0
  uni_links: ^0.5.1

  # Background Tasks
  workmanager: ^0.5.2

  # Widgets for Desktop
  window_manager: ^0.3.7
  # system_tray: ^2.0.3  # Removed due to uuid version conflict

  # Shortcuts
  quick_actions: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  riverpod_generator: ^2.3.9
  injectable_generator: ^2.4.1
  retrofit_generator: ^8.0.6
  isar_generator: ^3.1.0+1

  # Testing
  mocktail: ^1.0.2
  mockito: ^5.4.4
  integration_test:
    sdk: flutter
  patrol: ^3.1.0

  # Coverage
  coverage: ^1.7.1

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

# Splash Screen Configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_logo.png"
  color_dark: "#121212"
  image_dark: "assets/images/splash_logo_dark.png"
  android_12:
    image: "assets/images/splash_logo.png"
    color: "#FFFFFF"
  web: true
  android: true
  ios: true

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/illustrations/
    - assets/sounds/
    - .env
    - .env.development
    - .env.production

  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
